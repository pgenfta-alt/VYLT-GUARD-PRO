<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Core Lock Glow -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filter for Cyber Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Base with Cyber Glow -->
  <path d="M 256 32 
           L 440 96 
           C 440 280, 360 416, 256 480 
           C 152 416, 72 280, 72 96 
           Z" 
        fill="url(#bgGlow)" 
        stroke="url(#shieldGrad)" 
        stroke-width="18" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Inner Concentric Cyber Shield Line -->
  <path d="M 256 72 
           L 404 124 
           C 404 270, 338 380, 256 432 
           C 174 380, 108 270, 108 124 
           Z" 
        fill="none" 
        stroke="rgba(56, 189, 248, 0.25)" 
        stroke-width="6" 
        stroke-dasharray="12 8" />

  <!-- Circuit Trace Lines -->
  <path d="M 120 180 L 190 180 L 220 220" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="120" cy="180" r="8" fill="#38bdf8" />

  <path d="M 392 180 L 322 180 L 292 220" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="392" cy="180" r="8" fill="#6366f1" />

  <path d="M 256 360 L 256 410" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="256" cy="410" r="7" fill="#34d399" />

  <!-- Central Cryptographic Shackle / Padlock -->
  <!-- Shackle -->
  <path d="M 206 230 
           V 185 
           A 50 50 0 0 1 306 185 
           V 230" 
        fill="none" 
        stroke="url(#coreGlow)" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="186" y="230" width="140" height="110" rx="22" 
        fill="#0b1329" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" />

  <!-- Keyhole & Quantum Dot -->
  <circle cx="256" cy="275" r="14" fill="#38bdf8" />
  <polygon points="250,275 262,275 266,310 246,310" fill="#38bdf8" />
</svg>
